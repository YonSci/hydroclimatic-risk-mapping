# Book settings
title: Hydroclimatic Risk Mapping - Ethiopia
author: YonSci
exclude_patterns:
  - _build
  - Thumbs.db
  - .DS_Store
  - "**.ipynb_checkpoints"
only_build_toc_files: true

repository:
  url: https://github.com/YonSci/hydroclimatic-risk-mapping
  branch: main

html:
  home_page_in_navbar: false
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true
  baseurl: https://yonsci.github.io/hydroclimatic-risk-mapping
  extra_footer: |
    <div>
      <b>Hydroclimatic Risk Mapping</b><br>
      Seasonal drought and excess-wetness risk mapping for Ethiopia using
      Risk = Hazard x Exposure x Vulnerability.<br>
      <b>How to cite:</b> YonSci, <i>Hydroclimatic Risk Mapping - Ethiopia</i>,
      <a href="https://github.com/YonSci/hydroclimatic-risk-mapping">github.com/YonSci/hydroclimatic-risk-mapping</a>.<br>
      <b>Code license:</b> MIT. Third-party data retain their own licenses --
      see <a href="https://yonsci.github.io/hydroclimatic-risk-mapping/docs/data_provenance.html">Data Provenance</a> for the full list.
    </div>

execute:
  execute_notebooks: off
  allow_errors: true

sphinx:
  config:
    html_last_updated_fmt: "%b %d, %Y"
    html_show_copyright: false
